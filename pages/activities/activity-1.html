    <!--
    ============================================================
                        ACTIVITY: TEXT ELEMENTS
    ============================================================

    Directions:
    Create a simple webpage about yourself using HTML text elements.
    Do NOT copy from your classmates. Replace all placeholder text
    with your own information.

    Requirements:

    1. Create one main heading (<h1>) containing your full name.

    2. Create at least three (<h2>) headings with the following titles:
       - About Me
       - My Hobbies
       - My Favorite Subject

    3. Under each heading, create one paragraph (<p>).

    4. In one paragraph, use the <strong> element to make an
       important word or sentence stand out.

    5. In another paragraph, use the <em> element to emphasize a word.

    6. Add a short quotation using the <q> element.

    7. Add a long quotation using the <blockquote> element.

    8. Use the <abbr> element for "HTML" with its complete meaning.

    9. Mention your favorite book or movie using the <cite> element.

    10. Define the term HTML using the <dfn> element.

    Bonus Challenge:
    - Add one <h3> heading.
    - Add another paragraph.
    - Add another quotation.
    - Add another abbreviation.

    Save your work and preview it in your browser.
    ============================================================
    -->
  </body>
</html>
