    <!--
    ============================================================
                    ACTIVITY: CREATE AN HTML TABLE
    ============================================================

    Directions:
    Create an HTML table that displays your class schedule or
    student grades. Build the table from scratch without copying
    examples from the lecture.

    ------------------------------------------------------------
    PART I - Table Structure
    ------------------------------------------------------------

    Create the following table elements:

    ✓ table
    ✓ thead
    ✓ tbody
    ✓ tfoot
    ✓ tr
    ✓ th
    ✓ td

    ------------------------------------------------------------
    PART II - Table Heading
    ------------------------------------------------------------

    Create ONE header row containing the following headings:

    • Subject
    • Teacher
    • Day
    • Time
    • Room

    ------------------------------------------------------------
    PART III - Table Body
    ------------------------------------------------------------

    Add at least FIVE rows of data.

    Example subjects:
    • Programming
    • Mathematics
    • English
    • Science
    • Physical Education

    You may use your own schedule if available.

    ------------------------------------------------------------
    PART IV - Empty Cell
    ------------------------------------------------------------

    Leave ONE table cell empty to demonstrate an empty <td>.

    ------------------------------------------------------------
    PART V - Table Footer
    ------------------------------------------------------------

    Create a footer row that displays a summary such as:

    • Total Subjects: 5
    -->
