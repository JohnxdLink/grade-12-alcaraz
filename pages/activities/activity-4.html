<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Chapter Activity - HTML Forms</title>
  </head>
  <body>
    <!--
    ============================================================
                  ACTIVITY: CREATE A STUDENT REGISTRATION FORM
    ============================================================

    Directions:
    Create a student registration form using only the HTML
    elements discussed in this chapter.

    Do NOT copy examples from the lecture.
    Type every HTML element yourself.

    ------------------------------------------------------------
    PART I - Create the Form
    ------------------------------------------------------------

    Create one <form> element.

    ------------------------------------------------------------
    PART II - Student Information
    ------------------------------------------------------------

    Add text fields with labels for the following:

    • Full Name
    • Age
    • Section

    Every text field must have:

    ✓ A <label>
    ✓ An <input type="text">
    ✓ A unique id
    ✓ A matching for attribute in the label

    ------------------------------------------------------------
    PART III - Gender
    ------------------------------------------------------------

    Create radio buttons for:

    ○ Male
    ○ Female

    Requirements:

    ✓ Each radio button has a label.
    ✓ Only one option can be selected.

    ------------------------------------------------------------
    PART IV - Hobbies
    ------------------------------------------------------------

    Create checkboxes for at least FOUR hobbies.

    Example:

    □ Reading
    □ Playing Sports
    □ Watching Movies
    □ Playing Video Games

    Requirements:

    ✓ Every checkbox has a label.
    ✓ Users can select multiple hobbies.

    ------------------------------------------------------------
    PART V - Buttons
    ------------------------------------------------------------

    Add the following buttons:

    ✓ One Submit button
    ✓ One Button element (type="button")

    ------------------------------------------------------------
    BONUS CHALLENGE
    ------------------------------------------------------------

    □ Add two more text fields.

    □ Add another group of radio buttons.

    □ Add three more hobbies.

    □ Organize your form neatly using headings and paragraphs.

    ============================================================
    -->
  </body>
</html>
